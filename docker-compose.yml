services:
  mysql:
    image: mysql:8
    container_name: shared-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: htt
      MYSQL_USER: share
      MYSQL_PASSWORD: 123456
      MYSQL_TCP_PORT: 3307
    ports:
      - '3307:3307'
    command: --port=3307 --bind-address=0.0.0.0
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mynetwork

  mongo:
    image: mongo:6.0
    container_name: mongo-container
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - mynetwork

volumes:
  mysql_data:
  mongo_data:

networks:
  mynetwork:
